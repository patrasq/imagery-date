name: release

# Publishes imagery-date to npm when a version tag (v0.1.0, …) is pushed. It authenticates with npm trusted publishing
# (OIDC) once that is configured for this workflow on npmjs.com, and with the NPM_TOKEN secret until then
# (CONTRIBUTING.md, Releasing; DECISIONS.md D-018).
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check that the tag matches the package version
        run: test "v$(node -p "require('./packages/imagery-date/package.json').version")" = "$GITHUB_REF_NAME"
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global npm@11.21.0
      - run: npm publish --access public --provenance
        working-directory: packages/imagery-date
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
